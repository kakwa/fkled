[package]
name = "ledfx_editor"
version = "0.1.0"
edition = "2021"
default-run = "serve"

[lib]
name = "ledfx_editor"
path = "src/lib.rs"

[[bin]]
name = "serve"
path = "src/serve.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
flate2 = "1.0"
gif = "0.13"
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
