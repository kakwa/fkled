[package]
name = "ledfx_editor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ledfx_editor"
path = "src/main.rs"

[[bin]]
name = "serve"
path = "src/serve.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.28"
egui_extras = { version = "0.28", features = ["image"] }
image = { version = "0.25", features = ["gif", "png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = "0.4"
gif = "0.13"
flate2 = "1.0"
byteorder = "1.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlElement", "HtmlAnchorElement", "HtmlInputElement", "File", "FileList", "FileReader", "Blob", "BlobPropertyBag", "Url", "Event"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.14"
